---
- name: Ensure required tooling is installed, validated and logged in
  hosts: all

  vars:
    git_repo_url: "https://github.com/ansible/ansible-examples.git"
    git_dest: "/home/{{ ansible_user }}/repo"

    podman_registry_url: "quay.io"
    podman_registry_username: ""
    podman_registry_password: ""

    oc_api_url: "https://api.example.com:6443"
    oc_token: ""
    oc_cli_download_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz"

    # TASK 3: versi exact git, podman, python3 
    git_version: "2.55.0-1.fc44"
    podman_version: "5:5.8.1-1.fc44"
    python3_version: "3.14.3-2.fc44"

  tasks:

    # TASK 2 (Pre-validation)
    - name: Validasi git_repo_url harus diawali https://
      ansible.builtin.assert:
        that:
          - git_repo_url is defined and git_repo_url | length > 0
          - git_repo_url is match("^https://")
        fail_msg: "git_repo_url tidak valid! Harus diawali 'https://' (contoh: https://github.com/username/repo.git)"
        success_msg: "git_repo_url valid."

    - name: Validasi podman_registry_url (tanpa https://)
      ansible.builtin.assert:
        that:
          - podman_registry_url is defined and podman_registry_url | length > 0
          - not (podman_registry_url is match("^https?://"))
        fail_msg: "podman_registry_url tidak valid! Cukup tulis nama host-nya saja, JANGAN diawali http:// atau https:// (contoh: quay.io)"
        success_msg: "podman_registry_url valid."

    - name: Validasi podman_registry_username tidak kosong
      ansible.builtin.assert:
        that:
          - podman_registry_username is defined and podman_registry_username | length > 0
        fail_msg: "podman_registry_username tidak boleh kosong!"
        success_msg: "podman_registry_username valid."

    - name: Validasi podman_registry_password tidak kosong
      ansible.builtin.assert:
        that:
          - podman_registry_password is defined and podman_registry_password | length > 0
        fail_msg: "podman_registry_password tidak boleh kosong!"
        success_msg: "podman_registry_password valid."

    - name: Validasi oc_api_url harus diawali https://
      ansible.builtin.assert:
        that:
          - oc_api_url is defined and oc_api_url | length > 0
          - oc_api_url is match("^https://")
        fail_msg: "oc_api_url tidak valid! Harus diawali 'https://' (contoh: https://api.cluster.example.com:6443)"
        success_msg: "oc_api_url valid."

    - name: Validasi oc_token harus diawali sha256~
      ansible.builtin.assert:
        that:
          - oc_token is defined and oc_token | length > 0
          - oc_token is match("^sha256~")
        fail_msg: "oc_token tidak valid! Token OpenShift harus diawali 'sha256~'"
        success_msg: "oc_token valid."

    # --- Install ---
    - name: Install git, podman and python3 (exact version)
      ansible.builtin.dnf:
        name:
          - "git-{{ git_version }}"
          - "podman-{{ podman_version }}"
          - "python3-{{ python3_version }}"
        state: present
        allow_downgrade: true   # supaya versi tetap dipasang exact walau ada versi lebih baru/lama di repo
      become: true

    - name: Download oc CLI
      ansible.builtin.get_url:
        url: "{{ oc_cli_download_url }}"
        dest: "/tmp/openshift-client-linux.tar.gz"
        mode: "0644"

    - name: Extract oc to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/openshift-client-linux.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        mode: "0755"
      become: true

    # --- Validate ---
    - name: Check versions of all tools
      ansible.builtin.command: "{{ item }}"
      loop:
        - git --version
        - podman --version
        - python3 --version
        - oc version --client
      register: tool_versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ tool_versions.results | map(attribute='stdout') | list }}"

    # --- git clone ---
    - name: Clone the git repository
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_dest }}"

    # --- podman login ---
    - name: Log in to the container registry with podman
      ansible.builtin.command: "podman login {{ podman_registry_url }} -u {{ podman_registry_username }} -p {{ podman_registry_password }}"
      when: podman_registry_username | length > 0 and podman_registry_password | length > 0
      no_log: true

    # --- oc login ---
    - name: Log in to the OpenShift cluster with oc
      ansible.builtin.command: "oc login {{ oc_api_url }} --token={{ oc_token }}"
      when: oc_token | length > 0
      no_log: true

    - name: Confirm oc login
      ansible.builtin.command: oc whoami
      register: oc_whoami
      changed_when: false
      when: oc_token | length > 0

    - name: Show oc login identity
      ansible.builtin.debug:
        msg: "Logged in as {{ oc_whoami.stdout }}"
      when: oc_token | length > 0